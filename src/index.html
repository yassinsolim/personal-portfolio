<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      background-color: rgb(0, 0, 0);
      margin: 0;
    }

    #webgl {
      pointer-events: none;
    }

    #ui-app {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #ui {
      position: absolute;
      overflow: hidden;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    #css {
      cursor: pointer;
    }

    #ui-interactive {
      position: absolute;
      top: 0;
      left: 0;
      width: 256px;
    }
  </style>

  <!-- Primary Meta Tags -->
  <title>yassin</title>
  <meta name="title" content="yassin">
  <meta name="description" content="Yassin Soliman's interactive personal site.">
  <link rel="canonical" href="https://yassin.app/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="yassin">
  <meta property="og:url" content="https://yassin.app/">
  <meta property="og:title" content="yassin">
  <meta property="og:description" content="Yassin Soliman's interactive personal site.">

  <!-- Twitter -->


  <meta property="twitter:card" content="summary_large_image">
  <meta name="twitter:card" content="summary_large_image">

  <meta property="twitter:url" content="https://yassin.app/">
  <meta name="twitter:url" content="https://yassin.app/">

  <meta property="twitter:title" content="yassin">
  <meta name="twitter:title" content="yassin">

  <meta property="twitter:description" content="Yassin Soliman's interactive personal site.">
  <meta name="twitter:description" content="Yassin Soliman's interactive personal site.">

  <meta property="twitter:image" content="https://yassin.app/images/og-image.jpg">
  <meta name="twitter:image" content="https://yassin.app/images/og-image.jpg">
  <meta name="twitter:image:alt" content="A Mercedes-AMG One next to a desk with three monitors">

  <!-- Images -->
  <meta property="og:image" content="https://yassin.app/images/og-image.jpg">
  <meta property="og:image:secure_url" content="https://yassin.app/images/og-image.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A Mercedes-AMG One next to a desk with three monitors">

  <meta name="theme-color" content="#0e0f12">
  <link rel="icon" href="../static/favicon.ico" sizes="32x32">
  <link rel="icon" href="../static/images/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../static/images/apple-touch-icon.png">
  <link rel="manifest" href="../static/site.webmanifest">

</head>

<body>
  <div id="css"></div>
  <div id="webgl"></div>
  <div id="overlay"></div>
  <div id="ui-interactive"></div>
  <div id="ui"></div>
</body>

</html>
