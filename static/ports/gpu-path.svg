<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
  <title>How the game's Xbox 360 GPU commands become Vulkan work on the phone</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8a91"/>
    </marker>
  </defs>
  <rect width="560" height="860" rx="16" fill="#111113"/>

  <g font-size="18" fill="#f2f2f3">
    <rect x="24" y="24" width="512" height="72" rx="10" fill="#18181b" stroke="#8ea1ff" stroke-width="1.5"/>
    <text x="44" y="54" font-weight="600">Game + Direct3D 9 (recompiled guest code)</text>
    <text x="44" y="80" font-size="15" fill="#a0a0a6">writes PM4 packets into a ring buffer in guest memory</text>

    <line x1="280" y1="98" x2="280" y2="126" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>

    <rect x="24" y="130" width="512" height="94" rx="10" fill="#18181b" stroke="#7ad3a8" stroke-width="1.5"/>
    <text x="44" y="160" font-weight="600">Ring consumer: the Xenos command processor</text>
    <text x="44" y="186" font-size="15" fill="#a0a0a6">register writes land in one register file;</text>
    <text x="44" y="208" font-size="15" fill="#a0a0a6">a draw is "the primitive + whatever the registers hold"</text>

    <line x1="148" y1="226" x2="148" y2="264" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <line x1="412" y1="226" x2="412" y2="264" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <text x="160" y="252" font-size="14" fill="#a0a0a6">IM_LOAD</text>
    <text x="424" y="252" font-size="14" fill="#a0a0a6">DRAW_INDX</text>
  </g>

  <g font-size="16" fill="#f2f2f3">
    <!-- left column: shaders -->
    <rect x="24" y="268" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="40" y="298" font-weight="600">Shader microcode</text>
    <text x="40" y="322" font-size="14" fill="#a0a0a6">hashed once, kept by address</text>
    <line x1="148" y1="348" x2="148" y2="376" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <rect x="24" y="380" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="40" y="410" font-weight="600">Translator → SPIR-V</text>
    <text x="40" y="434" font-size="14" fill="#a0a0a6">straight line, or a pc switch</text>
    <line x1="148" y1="460" x2="148" y2="488" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <rect x="24" y="492" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="40" y="522" font-weight="600">Pipeline libraries</text>
    <text x="40" y="546" font-size="14" fill="#a0a0a6">built on worker threads</text>

    <!-- right column: draws -->
    <rect x="288" y="268" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="304" y="298" font-weight="600">Draw + register state</text>
    <text x="304" y="322" font-size="14" fill="#a0a0a6">targets, blend, depth, fetches</text>
    <line x1="412" y1="348" x2="412" y2="376" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <rect x="288" y="380" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="304" y="410" font-weight="600">Frame arena</text>
    <text x="304" y="434" font-size="14" fill="#a0a0a6">indices, constants, vertices</text>
    <line x1="412" y1="460" x2="412" y2="488" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>
    <rect x="288" y="492" width="248" height="78" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="304" y="522" font-weight="600">Recorder thread</text>
    <text x="304" y="546" font-size="14" fill="#a0a0a6">Vulkan command buffers</text>
  </g>

  <g font-size="18" fill="#f2f2f3">
    <path d="M148 572 V610 H272" fill="none" stroke="#8a8a91" stroke-width="2"/>
    <path d="M412 572 V610 H288" fill="none" stroke="#8a8a91" stroke-width="2"/>
    <line x1="280" y1="610" x2="280" y2="640" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>

    <rect x="24" y="644" width="512" height="72" rx="10" fill="#18181b" stroke="#3a3a3f"/>
    <text x="44" y="674" font-weight="600">Vulkan driver: Turnip on the Adreno GPU</text>
    <text x="44" y="700" font-size="15" fill="#a0a0a6">loaded in its own linker namespace (libadrenotools)</text>

    <line x1="280" y1="718" x2="280" y2="746" stroke="#8a8a91" stroke-width="2" marker-end="url(#a)"/>

    <rect x="24" y="750" width="512" height="86" rx="10" fill="#18181b" stroke="#8ea1ff" stroke-width="1.5"/>
    <text x="44" y="780" font-weight="600">Window thread presents</text>
    <text x="44" y="806" font-size="15" fill="#a0a0a6">one frame per display blank (FIFO); the game's</text>
    <text x="44" y="826" font-size="15" fill="#a0a0a6">60 Hz cap lifted to the panel's 120 Hz</text>
  </g>
</svg>
